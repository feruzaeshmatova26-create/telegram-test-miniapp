<!DOCTYPE html>
<html lang="uz">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ziyo Test</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

body{

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#2563eb
);

min-height:100vh;

padding:18px;

color:white;

}

.card{

background:
rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:28px;

padding:24px;

}

.logo{

font-size:60px;

text-align:center;

}

.title{

text-align:center;

font-size:34px;

font-weight:900;

}

.sub{

text-align:center;

opacity:.7;

margin-top:10px;

}

.role{

display:grid;

gap:14px;

margin-top:25px;

}

button{

width:100%;

padding:18px;

border:none;

border-radius:18px;

font-size:18px;

}

.primary{

background:#2563eb;

color:white;

}

.secondary{

background:
rgba(255,255,255,.08);

color:white;

}

input{

width:100%;

padding:16px;

border:none;

border-radius:16px;

margin-top:12px;

}

.page{

display:none;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
🎓
</div>

<div class="title">
ZIYO TEST
</div>

<div class="sub">
Online Test Platform
</div>

<div id="home">

<div class="role">

<button
class="secondary"
onclick="openStudent()">

👨‍🎓 Talaba

</button>

<button
class="primary"
onclick="openAdmin()">

🛡️ Admin

</button>

</div>

</div>

<div
id="student"
class="page">

<input placeholder="Ism">

<input placeholder="Telefon">

<input type="password"
placeholder="Parol">

<button
class="primary"
onclick="register()">

Ro‘yxatdan o‘tish

</button>

<br><br>

<button
class="secondary"
onclick="back()">

Orqaga

</button>

</div>

<div
id="admin"
class="page">

<input id="login"
placeholder="Login">

<input
id="password"

type="password"

placeholder="Parol">

<button
class="primary"
onclick="login()">

Kirish

</button>

<br><br>

<button
class="secondary"
onclick="back()">

Orqaga

</button>

</div>

</div>

<script>

Telegram.WebApp.expand();

function hide(){

home.style.display="none";

student.style.display="none";

admin.style.display="none";

}

function openStudent(){

hide();

student.style.display="block";

}

function openAdmin(){

hide();

admin.style.display="block";

}

function back(){

student.style.display="none";

admin.style.display="none";

home.style.display="block";

}

function register(){

alert(
"Talaba yaratildi ✅"
);

}

function login(){

let user=
document
.getElementById(
"login"
).value;

let pass=
document
.getElementById(
"password"
).value;

if(
user==="admin"
&&
pass==="12345"
){

document.body.innerHTML=`

<div class='card'>

<h1>

👑 Superadmin

</h1>

<br>

<input
placeholder='Admin login'>

<input
placeholder='Parol'>

<button
class='primary'>

Admin yaratish

</button>

<br><br>

<div>

📊 Statistika

</div>

</div>

`;

}else{

alert(
"Xato login ❌"
);

}

}

</script>

</body>

</html>
