<!DOCTYPE html>
<html lang="uz">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ziyo Test</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

body{

background:
linear-gradient(
135deg,
#0F172A,
#1E293B,
#2563EB
);

min-height:100vh;

padding:20px;

color:white;

}

.card{

background:
rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:28px;

padding:26px;

}

.logo{

font-size:60px;

text-align:center;

}

.title{

text-align:center;

font-size:34px;

font-weight:800;

margin-top:10px;

}

.subtitle{

text-align:center;

opacity:.7;

margin-top:8px;

}

.role{

margin-top:24px;

display:grid;

gap:14px;

}

.role button{

padding:18px;

border:none;

border-radius:18px;

font-size:18px;

color:white;

background:
rgba(255,255,255,.08);

}

.form{

display:none;

margin-top:20px;

}

input{

width:100%;

padding:18px;

margin-top:12px;

border:none;

border-radius:18px;

}

.submit{

background:#2563EB;

color:white;

font-size:18px;

}

.back{

margin-top:12px;

background:#334155;

color:white;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
🎓
</div>

<div class="title">

ZIYO TEST

</div>

<div class="subtitle">

Admin va Talaba tizimi

</div>

<div id="home" class="role">

<button onclick="student()">
👨‍🎓 Talaba
</button>

<button onclick="admin()">
🛡️ Admin
</button>

</div>

<div id="student" class="form">

<input placeholder="Ism">

<input placeholder="Telefon">

<input placeholder="Parol">

<button class="submit">
Ro‘yxatdan o‘tish
</button>

<button
class="back"
onclick="back()">

Orqaga

</button>

</div>

<div id="admin" class="form">

<input placeholder="Login">

<input placeholder="Parol">

<button
class="submit"
onclick="login()">

Kirish

</button>

<button
class="back"
onclick="back()">

Orqaga

</button>

</div>

</div>

<script>

Telegram.WebApp.expand();

function hide(){

home.style.display="none";

student.style.display="none";

admin.style.display="none";

}

function student(){

hide();

document
.getElementById("student")
.style.display="block";

}

function admin(){

hide();

document
.getElementById("admin")
.style.display="block";

}

function back(){

student.style.display="none";

admin.style.display="none";

home.style.display="grid";

}

function login(){

alert(
"Keyingi bosqichda superadmin tekshiruvi ulanadi"
);

}

</script>

</body>

</html>
