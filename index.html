<!DOCTYPE html>
<html lang="uz">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ziyo Test</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

body{

background:
linear-gradient(
135deg,
#071226,
#111827,
#1d4ed8
);

min-height:100vh;

color:white;

padding:20px;

}

.card{

background:
rgba(255,255,255,.08);

border:1px solid
rgba(255,255,255,.1);

backdrop-filter:blur(18px);

border-radius:28px;

padding:24px;

}

.logo{

font-size:72px;

text-align:center;

}

.title{

text-align:center;

font-size:34px;

font-weight:900;

margin-top:12px;

}

.sub{

text-align:center;

opacity:.7;

margin-top:8px;

}

.grid{

display:grid;

gap:14px;

margin-top:24px;

}

button{

width:100%;

padding:18px;

border:none;

border-radius:18px;

font-size:18px;

color:white;

}

.primary{

background:#2563EB;

}

.dark{

background:#1E293B;

}

.success{

background:#059669;

}

.form{

display:none;

margin-top:20px;

}

input{

width:100%;

padding:16px;

border:none;

border-radius:16px;

margin-top:12px;

}

.back{

margin-top:12px;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
🎓
</div>

<div class="title">

ZIYO TEST

</div>

<div class="sub">

Online Test Platform

</div>

<div id="home">

<div class="grid">

<button
class="success"
onclick="openStudent()">

👨‍🎓 Talaba

</button>

<button
class="primary"
onclick="openAdmin()">

🛡️ Admin

</button>

<button
class="dark"
onclick="openSuper()">

👑 Superadmin

</button>

</div>

</div>

<div
id="student"
class="form">

<input
placeholder="Ism">

<input
placeholder="Telefon">

<input
type="password"
placeholder="Parol">

<button
class="success">

Ro‘yxatdan o‘tish

</button>

<button
class="dark back"
onclick="back()">

Orqaga

</button>

</div>

<div
id="admin"
class="form">

<input
placeholder="Login">

<input
type="password"
placeholder="Parol">

<button
class="primary">

Kirish

</button>

<button
class="dark back"
onclick="back()">

Orqaga

</button>

</div>

<div
id="super"
class="form">

<input
id="s1"
placeholder="Login">

<input
id="s2"
type="password"
placeholder="Parol">

<button
class="dark"
onclick="superLogin()">

Kirish

</button>

<button
class="dark back"
onclick="back()">

Orqaga

</button>

</div>

</div>

<script>

Telegram.WebApp.expand();

function hide(){

home.style.display="none";

student.style.display="none";

admin.style.display="none";

super.style.display="none";

}

function openStudent(){

hide();

student.style.display="block";

}

function openAdmin(){

hide();

admin.style.display="block";

}

function openSuper(){

hide();

super.style.display="block";

}

function back(){

student.style.display="none";

admin.style.display="none";

super.style.display="none";

home.style.display="block";

}

function superLogin(){

let l=
document
.getElementById("s1")
.value;

let p=
document
.getElementById("s2")
.value;

if(
l==="admin"
&&
p==="12345"
){

alert(
"Superadmin panel tayyor 🚀"
);

}else{

alert(
"Login xato ❌"
);

}

}

</script>

</body>

  </html>
