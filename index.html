<!DOCTYPE html>
<html lang="uz">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ziyo Test</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

body{

background:
linear-gradient(
180deg,
#0b1220,
#162033
);

min-height:100vh;

padding:20px;

color:white;

}

.top{

display:flex;

justify-content:space-between;

margin-bottom:20px;

}

.badge{

background:#1f2937;

padding:10px 16px;

border-radius:999px;

}

.card{

background:

linear-gradient(
180deg,
#1e293b,
#172033
);

padding:24px;

border-radius:28px;

box-shadow:
0 20px 50px rgba(0,0,0,.35);

}

.logo{

font-size:60px;

text-align:center;

}

.title{

text-align:center;

font-size:34px;

font-weight:800;

margin-top:12px;

}

.sub{

text-align:center;

opacity:.7;

margin-top:8px;

}

.progress{

margin-top:22px;

height:10px;

background:#334155;

border-radius:999px;

overflow:hidden;

}

.fill{

height:100%;

width:25%;

background:#3b82f6;

}

.question{

font-size:22px;

margin-top:28px;

font-weight:700;

}

.option{

width:100%;

padding:18px;

margin-top:14px;

border:none;

border-radius:18px;

background:#243246;

color:white;

font-size:18px;

}

.option:active{

transform:scale(.98);

}

.result{

display:none;

text-align:center;

padding:20px;

}

.score{

font-size:60px;

margin-bottom:14px;

}

</style>

</head>

<body>

<div class="top">

<div class="badge">
📝 Test
</div>

<div class="badge">
1 / 10
</div>

</div>

<div class="card">

<div id="quiz">

<div class="logo">
🚀
</div>

<div class="title">
ZIYO TEST
</div>

<div class="sub">
Bilimingizni sinab ko‘ring
</div>

<div class="progress">
<div class="fill"></div>
</div>

<div class="question">
Android Studio qaysi kompaniyaga tegishli?
</div>

<button class="option" onclick="finish(true)">
A • Google
</button>

<button class="option" onclick="finish(false)">
B • Apple
</button>

<button class="option" onclick="finish(false)">
C • Telegram
</button>

<button class="option" onclick="finish(false)">
D • Samsung
</button>

</div>

<div class="result" id="result">

<div class="score">
🏆
</div>

<h2>Natija</h2>

<p id="text"></p>

</div>

</div>

<script>

Telegram.WebApp.expand();

function finish(ok){

quiz.style.display="none";

result.style.display="block";

text.innerHTML=
ok
?
"100 Ball ✅"
:
"Qayta urinib ko‘ring ❌";

}

</script>

</body>

</html>
