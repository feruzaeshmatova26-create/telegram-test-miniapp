<!DOCTYPE html>
<html lang="uz">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ziyo Test</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

body{

background:
linear-gradient(
-45deg,
#0f172a,
#1e293b,
#1d4ed8,
#0f172a
);

background-size:400% 400%;

animation:bg 12s ease infinite;

color:white;

min-height:100vh;

padding:18px;

}

@keyframes bg{

0%{background-position:0% 50%}

50%{background-position:100% 50%}

100%{background-position:0% 50%}

}

.card{

backdrop-filter:blur(25px);

background:
rgba(255,255,255,.08);

border:1px solid
rgba(255,255,255,.12);

border-radius:30px;

padding:22px;

margin-top:16px;

}

.hero{

padding:26px;

}

.avatar{

width:80px;

height:80px;

border-radius:50%;

background:#2563eb;

display:flex;

align-items:center;

justify-content:center;

font-size:34px;

margin:auto;

}

.title{

text-align:center;

font-size:34px;

font-weight:900;

margin-top:18px;

}

.sub{

text-align:center;

opacity:.75;

margin-top:8px;

}

.btn{

width:100%;

padding:18px;

border:none;

border-radius:18px;

font-size:18px;

margin-top:24px;

background:
linear-gradient(
90deg,
#2563eb,
#4f46e5
);

color:white;

}

.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:14px;

margin-top:18px;

}

.box{

background:
rgba(255,255,255,.06);

padding:18px;

border-radius:18px;

}

.box h2{

font-size:28px;

}

.progress{

height:12px;

background:
rgba(255,255,255,.1);

border-radius:999px;

overflow:hidden;

margin-top:14px;

}

.fill{

height:100%;

width:65%;

background:
linear-gradient(
90deg,
#22c55e,
#3b82f6
);

}

.rank{

display:flex;

justify-content:space-between;

padding:18px;

margin-top:14px;

background:
rgba(255,255,255,.06);

border-radius:18px;

}

.categories{

display:flex;

gap:12px;

overflow:auto;

margin-top:14px;

}

.cat{

min-width:120px;

padding:18px;

border-radius:18px;

background:
rgba(255,255,255,.08);

}

</style>

</head>

<body>

<div class="card hero">

<div class="avatar">
🎓
</div>

<div class="title">

ZIYO TEST

</div>

<div class="sub">

Telegram Mini App

</div>

<button
class="btn"
onclick="start()">

🚀 Testni boshlash

</button>

</div>

<div class="grid">

<div class="box">

📊

<h2>1280</h2>

Testlar

</div>

<div class="box">

🏆

<h2>97%</h2>

Natija

</div>

</div>

<div class="card">

<h3>

Progress

</h3>

<div class="progress">

<div class="fill"></div>

</div>

</div>

<div class="card">

<h3>

Kategoriyalar

</h3>

<div class="categories">

<div class="cat">
🤖 AI
</div>

<div class="cat">
📱 Android
</div>

<div class="cat">
💻 IT
</div>

<div class="cat">
📚 Ingliz tili
</div>

</div>

</div>

<div class="card">

<h3>

🏅 Reyting

</h3>

<div class="rank">

<span>
Humoyiddin
</span>

<span>
#1
</span>

</div>

<div class="rank">

<span>
Foydalanuvchi
</span>

<span>
#2
</span>

</div>

</div>

<script>

Telegram.WebApp.expand();

function start(){

alert(
"Test sahifasi keyingi bosqichda ulanadi 🚀"
);

}

</script>

</body>

</html>
