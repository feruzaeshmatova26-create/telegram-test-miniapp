<!DOCTYPE html>
<html lang="uz">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ziyo Test</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

body{
background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#2563eb
);

min-height:100vh;

padding:20px;

color:white;
}

.card{

background:
rgba(255,255,255,.08);

padding:25px;

border-radius:28px;

backdrop-filter:blur(20px);

}

button{

width:100%;

padding:18px;

border:none;

border-radius:18px;

margin-top:12px;

}

.primary{

background:#2563eb;

color:white;

}

.gray{

background:#334155;

color:white;

}

input{

width:100%;

padding:16px;

border:none;

border-radius:16px;

margin-top:12px;

}

.page{

display:none;

}

.adminItem{

background:
rgba(255,255,255,.08);

padding:14px;

margin-top:10px;

border-radius:14px;

}

</style>

</head>

<body>

<div class="card">

<h1>
🎓 ZIYO TEST
</h1>

<br>

<div id="home">

<button
class="primary"
onclick="openAdmin()">

🛡️ Admin

</button>

<button
class="gray"
onclick="alert('Talaba keyin ulanadi')">

👨‍🎓 Talaba

</button>

</div>

<div
id="admin"
class="page">

<input
id="login"

placeholder="Login">

<input
id="password"

type="password"

placeholder="Parol">

<button
class="primary"
onclick="login()">

Kirish

</button>

<button
class="gray"
onclick="back()">

Orqaga

</button>

</div>

</div>

<script>

Telegram.WebApp.expand();

let admins=
JSON.parse(
localStorage.getItem(
"admins"
)||"[]"
);

function openAdmin(){

home.style.display="none";

admin.style.display="block";

}

function back(){

admin.style.display="none";

home.style.display="block";

}

function login(){

let l=
loginInput();

let p=
passwordInput();

if(
l==="admin"
&&
p==="12345"
){

superPanel();

return;

}

let found=
admins.find(
a=>
a.login===l
&&
a.password===p
);

if(found){

document.body.innerHTML=`

<div class='card'>

<h1>

🛡️ Admin panel

</h1>

<br>

Test yaratish
<br><br>

<button class='primary'>

+ Test qo'shish

</button>

</div>

`;

return;

}

alert(
"Login xato ❌"
);

}

function loginInput(){

return document
.getElementById(
"login"
).value;

}

function passwordInput(){

return document
.getElementById(
"password"
).value;

}

function superPanel(){

document.body.innerHTML=`

<div class='card'>

<h1>

👑 Superadmin

</h1>

<input
id='a1'
placeholder='Admin login'>

<input
id='a2'
placeholder='Parol'>

<button
class='primary'
onclick='createAdmin()'>

Admin yaratish

</button>

<div id='list'></div>

</div>

`;

render();

}

function createAdmin(){

let login=
document
.getElementById(
"a1"
).value;

let password=
document
.getElementById(
"a2"
).value;

admins.push({

login,

password

});

localStorage
.setItem(
"admins",
JSON.stringify(
admins
)
);

render();

}

function render(){

let html="";

admins.forEach(
a=>{

html+=`

<div
class='adminItem'>

🛡️ ${a.login}

</div>

`;

});

document
.getElementById(
"list"
).innerHTML=
html;

}

</script>

</body>

</html>
