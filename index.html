<!DOCTYPE html>
<html lang="uz">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Ziyo Test</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

body{

background:
linear-gradient(
135deg,
#071226,
#0F172A,
#2563EB
);

min-height:100vh;

padding:20px;

color:white;

}

.card{

background:
rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:28px;

padding:24px;

}

.logo{

font-size:70px;

text-align:center;

}

.title{

text-align:center;

font-size:34px;

font-weight:900;

margin-top:10px;

}

.sub{

text-align:center;

opacity:.7;

margin-top:10px;

}

.grid{

display:grid;

gap:14px;

margin-top:25px;

}

button{

width:100%;

padding:18px;

border:none;

border-radius:18px;

font-size:18px;

color:white;

}

.green{

background:#059669;

}

.blue{

background:#2563EB;

}

.gray{

background:#334155;

}

.form{

display:none;

margin-top:18px;

}

input{

width:100%;

padding:16px;

border:none;

border-radius:16px;

margin-top:12px;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

🎓

</div>

<div class="title">

ZIYO TEST

</div>

<div class="sub">

Online Test Platform

</div>

<div id="home">

<div class="grid">

<button
class="green"
onclick="show('student')">

👨‍🎓 Talaba

</button>

<button
class="blue"
onclick="show('admin')">

🛡️ Admin

</button>

<button
class="gray"
onclick="show('super')">

👑 Superadmin

</button>

</div>

</div>

<div
id="student"
class="form">

<input
placeholder="Ism">

<input
placeholder="Telefon">

<input
type="password"
placeholder="Parol">

<button
class="green"
onclick="studentRegister()">

Ro‘yxatdan o‘tish

</button>

</div>

<div
id="admin"
class="form">

<input
placeholder="Login">

<input
type="password"
placeholder="Parol">

<button
class="blue"
onclick="adminLogin()">

Kirish

</button>

</div>

<div
id="super"
class="form">

<input
id="s1"
placeholder="Login">

<input
id="s2"
type="password"
placeholder="Parol">

<button
class="gray"
onclick="superLogin()">

Kirish

</button>

</div>

</div>

<script src="app.js"></script>

</body>

</html>
